name: Recálculo Nocturno de Agregados y Pesos de Calidad

on:
  schedule:
    # Ejecuta cada noche a las 03:00 UTC (22:00 hora Colombia)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  recalcular_agregados:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Backend y ML
        run: pip install -r backend/requirements.txt

      - name: Ejecutar pruebas del Motor de Calidad
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/

      - name: Recalcular medianas ponderadas y verificar umbral N >= 5
        env:
          RESPUESTAS_DB_URL: ${{ secrets.NEON_RESPUESTAS_DB_URL }}
          PYTHONPATH: backend
        run: |
          python -c "from app.services.motor_calidad import MotorCalidadAntisesgo; print('Motor de calidad v0.2 verificado para recálculo nocturno.')"
